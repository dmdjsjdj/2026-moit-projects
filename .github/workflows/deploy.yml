name: MOIT v3 Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            PROJECT_DIR="/home/ubuntu/2026-moit-projects/moit-v3"

            echo "================================"
            echo "MOIT v3 deployment started"
            echo "================================"

            cd "$PROJECT_DIR"

            # 1. 최신 소스 가져오기
            echo "[1/6] Git pull"

            git fetch origin main
            git reset --hard origin/main

            # 2. Backend build
            echo "[2/6] Backend build"

            cd "$PROJECT_DIR/back"

            chmod +x gradlew
            ./gradlew clean bootJar

            # 3. Backend restart
            echo "[3/6] Backend restart"

            sudo systemctl restart moit-back

            # 4. Backend 확인
            echo "[4/6] Backend status"

            sleep 5

            if ! sudo systemctl is-active --quiet moit-back; then
              echo "❌ Backend failed"
              sudo journalctl -u moit-back -n 80 --no-pager
              exit 1
            fi

            echo "✅ Backend is running"

            # 5. Frontend build
            echo "[5/6] Frontend build"

            cd "$PROJECT_DIR/front"

            rm -rf .next

            npm install --legacy-peer-deps
            npm run build -- --no-lint

            # 6. Frontend restart
            echo "[6/6] Frontend restart"

            sudo systemctl restart moit-front

            sleep 5

            if ! sudo systemctl is-active --quiet moit-front; then
              echo "❌ Frontend failed"
              sudo journalctl -u moit-front -n 80 --no-pager
              exit 1
            fi

            echo "✅ Frontend is running"

            echo "================================"
            echo "MOIT v3 deployment completed"
            echo "================================"