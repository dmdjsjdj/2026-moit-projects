name: MOIT v3 Deploy

on:
  push:
    branches:
      - main

jobs:

  # =======================
  # Backend
  # =======================
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            PROJECT_DIR="/home/ubuntu/2026-moit-projects/moit-v3"

            echo "================================"
            echo "MOIT v3 Backend deployment"
            echo "================================"

            cd "$PROJECT_DIR"

            echo "[1/4] Git pull"

            git fetch origin main
            git reset --hard origin/main

            echo "[2/4] Backend build"

            cd "$PROJECT_DIR/back"

            chmod +x gradlew
            ./gradlew clean bootJar --no-daemon

            echo "[3/4] Backend restart"

            sudo systemctl restart moit-back

            echo "[4/4] Backend status"

            sleep 5

            if ! sudo systemctl is-active --quiet moit-back; then
              echo "❌ Backend failed"
              sudo journalctl -u moit-back -n 80 --no-pager
              exit 1
            fi

            echo "✅ Backend is running"


  # =========================
  # Frontend
  # =========================
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            PROJECT_DIR="/home/ubuntu/2026-moit-projects/moit-v3"

            echo "================================"
            echo "MOIT v3 Frontend deployment"
            echo "================================"

            cd "$PROJECT_DIR"

            echo "[1/4] Git pull"

            git fetch origin main
            git reset --hard origin/main

            echo "[2/4] Frontend install"

            cd "$PROJECT_DIR/front"

            npm install --legacy-peer-deps

            echo "[3/4] Frontend build"

            rm -rf .next

            npm run build -- --no-lint

            echo "[4/4] Frontend restart"

            sudo systemctl restart moit-front

            sleep 5

            if ! sudo systemctl is-active --quiet moit-front; then
              echo "❌ Frontend failed"
              sudo journalctl -u moit-front -n 80 --no-pager
              exit 1
            fi

            echo "✅ Frontend is running"